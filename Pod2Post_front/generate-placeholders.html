<!DOCTYPE html>
<html>
<head>
    <title>Generate Placeholder Images</title>
</head>
<body>
    <canvas id="canvas" width="400" height="533"></canvas>
    <script>
        // Generate placeholder images
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function generatePlaceholder(text, filename) {
            // Clear canvas
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 400, 533);
            
            // Add border
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, 398, 531);
            
            // Add text
            ctx.fillStyle = '#888';
            ctx.font = '24px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 200, 266);
            
            // Convert to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png');
        }
        
        // Generate images with delay
        setTimeout(() => generatePlaceholder('Episode Cover', 'example-cover.png'), 100);
        setTimeout(() => generatePlaceholder('Quote Card 1', 'example-quote1.png'), 500);
        setTimeout(() => generatePlaceholder('Quote Card 2', 'example-quote2.png'), 900);
        
        document.body.innerHTML = '<h2>Placeholder images generated!</h2><p>Move the downloaded files to assets/images/</p>';
    </script>
</body>
</html>
